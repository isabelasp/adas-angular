<div class="card">
    <div class="card-cabecalho">
        <img [src]="aluno.imagem">
    </div>
    <div class="card-conteudo">
        <p class="nome">{{aluno.nome }}</p>
        <p>{{aluno.email }}</p>
        <p>
            <strong>Turma:</strong> {{aluno.turma }}
        </p>        
        <p>
            <strong>Nota final:</strong> {{aluno.notaFinal }}
        </p>
    </div>
    <p class="status" 
    [ngClass]="{
        'aprovado' : aluno.notaFinal >= 7,
        'reprovado' : aluno.notaFinal < 7
    }">
        {{aluno.notaFinal >= 7 ? 'APROVADO' : 'REPROVADO'}}</p>
</div>
